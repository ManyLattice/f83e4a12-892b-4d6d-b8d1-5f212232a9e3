<!DOCTYPE html>
<html lang="ru" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вика, эти выходные</title>

<!-- Open Graph: preview when the link is shared in Telegram.
     Absolute URL is required - Telegram ignores relative paths.
     Replace the host once the GitHub Pages URL is known. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Вика, эти выходные">
<meta property="og:description" content="Выбирай">
<meta property="og:image" content="https://manylattice.github.io/weekend-date/images/fork.webp">

<!-- In-app browsers (Telegram, Instagram) paint their chrome over the
     page and tint it with this colour. Sampled from the evening sky of
     the fork illustration so the chrome blends into the artwork. -->
<meta name="theme-color" content="#C79A5C">

<link rel="preload" as="image" href="images/fork.webp">
<!-- Both outcomes are preloaded: the switch after a tap has to be
     instant, and a half-loaded scene would show a blank screen at the
     one moment the page is supposed to feel like an answer. -->
<link rel="preload" as="image" href="images/picnic.webp">
<link rel="preload" as="image" href="images/horses.webp">
<link rel="preload" as="image" href="images/title-fork.webp">

<style>
/* ===== Variables ===== */
:root {
  --dur: 650ms;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ink: #FFFFFF;
  /* The headings are lettering artwork now, so the only type left on the
     page is the button - system serif, no webfont to wait for. */
  --font-serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
}

/* ===== Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  /* Only ever visible for an instant before the artwork paints.
     Sampled from the illustration's own sky. */
  background-color: #E8B978;
  color: var(--ink);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;          /* single screen, never scrolls */
}

/* ===== Stage =====
   All three illustrations are stacked in the same box. Only one is
   opaque at a time, so switching scenes is a cross-fade rather than a
   load - nothing ever has to be fetched mid-gesture. */
.stage {
  position: relative;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

.scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
}

.scene.is-active { opacity: 1; }


/* The artwork was reframed so the blanket and the horses sit inside the
   9% that a tall phone crops from each side; the fork can fill the
   screen like the other scenes. */
/* The blanket sits at 5.1% of the artwork's width and the horses reach
   99.9% - 94.8% of the frame, while a phone's `cover` window shows only
   82% of it. The subjects are simply wider than any crop, so the fork is
   shown whole. The bands above and below continue its own sky and earth,
   so the page still reads as one picture. */
.scene--fork {
  object-fit: contain;
  background: linear-gradient(
    to bottom,
    #AA946E 0%,
    #C9A870 18%,
    #C9A870 82%,
    #774C1E 100%
  );
}

.scene--picnic { object-position: 50% 64%; }
.scene--horses { object-position: 45% 50%; }

/* Readability layer: white text has to survive both a pale sky and a
   sunlit field, and the resting dim also gives the hover states
   something to lift. */
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(28, 24, 16, 0.26);
  pointer-events: none;
  transition: background var(--dur) var(--ease);
  z-index: 1;
}

/* ===== Choice zones =====
   Two invisible halves laid over the fork. They are real <button>s so
   the choice is reachable from a keyboard, not just from a tap. */
.zones {
  position: absolute;
  inset: 0;
  display: flex;
  z-index: 2;
}

/* The fork is letterboxed, so the zones are clamped to the artwork's own
   box - a tap on the empty bands must not pick a road. Both terms come
   from the 941x1672 ratio. */
.zones {
  width: min(100%, calc(100dvh * 941 / 1672));
  height: min(100%, calc(100vw * 1672 / 941));
  inset: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.zone {
  flex: 1 1 50%;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  transition: background var(--dur) var(--ease);
}

/* Hover lifts the side you reach for and leaves the other alone -
   the road you lean toward gets brighter. */
@media (hover: hover) {
  .zone:hover { background: rgba(255, 244, 214, 0.13); }
}

.zone:active { background: rgba(28, 24, 16, 0.12); }

/* ===== Touch hints =====
   A pointer device gets the hover states above; a phone gets nothing, and
   nothing on this page says "the sides are tappable". These two slow
   pulses sit on the roads and take turns, so the eye reads them as one
   choice with two options rather than as decoration. They cost the image
   very little and disappear for good on the first touch. */
.hint {
  display: block;            /* an inline span ignores width/height */
  position: absolute;
  left: 50%;
  top: 58%;
  width: 62px;
  height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  border: 1px solid rgba(255, 248, 232, 0.85);
  background: rgba(255, 248, 232, 0.10);
  pointer-events: none;
  opacity: 0;
  animation: pulse 3.6s ease-in-out infinite;
}

/* The right hint runs half a cycle behind the left one: alternating
   reads as "either one", while pulsing together reads as decoration. */
[data-choice="horses"] .hint { animation-delay: 1.8s; }

@keyframes pulse {
  0%, 62%, 100% { opacity: 0;    transform: scale(0.82); }
  18%           { opacity: 0.95; transform: scale(1); }
  42%           { opacity: 0.5;  transform: scale(1.18); }
}

/* Hide them where hover already does the job, and the moment a choice
   is made. */
@media (hover: hover) {
  .hint { display: none; }
}

body.has-choice .hint,
body.is-touched .hint {
  animation: none;
  opacity: 0;
}

/* Once chosen, the zones stop existing - there is no way back. */
body.has-choice .zones { display: none; }

/* ===== Title =====
   Lettering images, cross-faded in place. They are decorative duplicates
   of the <h1> text, so they are hidden from assistive tech. */
.titles {
  position: fixed;
  /* Sits inside the top edge of the painted artwork, not of the viewport,
     so it never lands in the band above the sky. */
  top: calc(
    (100dvh - min(100dvh, 100vw * 1672 / 941)) / 2
    + max(2.4vh, 14px)
    + env(safe-area-inset-top)
  );
  left: 50%;
  transform: translateX(-50%);
  width: min(100% - 48px, 520px);
  pointer-events: none;      /* never blocks a tap on the zones */
  z-index: 3;
}

.title {
  display: block;
  width: 100%;
  height: auto;
  /* Stacked on top of each other so swapping one for another does not
     shift the layout; the first is in flow to give .titles its height. */
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
  filter: drop-shadow(0 2px 14px rgba(20, 16, 10, 0.5));
}

.title--fork { position: relative; }
.title.is-active { opacity: 1; }

/* The real words, kept for screen readers and search engines but taken
   out of the visual layer. */
.title-text {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ===== CTA ===== */
.cta {
  position: fixed;
  left: 50%;
  bottom: calc(8vh + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  z-index: 4;
  display: inline-block;
  padding: 16px 44px;
  border-radius: 999px;
  background: #FFFFFF;
  color: #2C2418;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.04em;
  text-decoration: none;
  box-shadow: 0 8px 30px rgba(20, 16, 10, 0.35);
  /* Hidden until a choice is made, and inert while hidden. */
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 380ms var(--ease),
              transform 380ms var(--ease),
              visibility 380ms;
}

.cta.is-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
}

/* ===== Breathing =====
   The page carries no "tap me" label, so stillness would read as a
   static picture. A slow zoom keeps the scene alive until a choice
   freezes it. */
@keyframes breathe {
  0%   { transform: scale(1.00); }
  50%  { transform: scale(1.04); }
  100% { transform: scale(1.00); }
}

.scene--fork.is-active { animation: breathe 11s ease-in-out infinite; }
body.has-choice .scene { animation: none; }

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  .scene, .stage::after, .cta, .zone { transition-duration: 1ms; }
  /* Keep the hints, but hold them still and visible - the affordance is
     needed even when motion is not wanted. */
  .hint { animation: none; opacity: 0.75; }
  .scene--fork.is-active { animation: none; }
}

/* ===== No JS =====
   Without the script the fork stays on screen and the choice is inert:
   a degraded page, never a blank one. */
.no-js .cta { display: none; }
.no-js .scene--fork { opacity: 1; }
</style>
</head>
<body>

<!-- The headings are hand-lettered artwork, not live text: the calligraphy
     is the whole point and no webfont renders it. The <h1> carries the
     real words for search engines, screen readers and the no-JS case,
     and is visually hidden. -->
<h1 class="title-text">Вика, эти выходные</h1>

<div class="titles">
  <img class="title title--fork is-active" src="images/title-fork.webp" alt="" aria-hidden="true">
  <img class="title title--picnic" src="images/title-picnic.webp" alt="" aria-hidden="true">
  <img class="title title--horses" src="images/title-horses.webp" alt="" aria-hidden="true">
</div>

<div class="stage">
  <img class="scene scene--fork is-active" src="images/fork.webp"
       alt="Пара стоит перед развилкой: слева пикник у пруда, справа лошади в степи">
  <img class="scene scene--picnic" src="images/picnic.webp" alt="">
  <img class="scene scene--horses" src="images/horses.webp" alt="">

  <div class="zones">
    <button class="zone" type="button" data-choice="picnic" aria-label="Пикник">
      <span class="hint" aria-hidden="true"></span>
    </button>
    <button class="zone" type="button" data-choice="horses" aria-label="Лошади">
      <span class="hint" aria-hidden="true"></span>
    </button>
  </div>
</div>

<a class="cta" href="#" target="_blank" rel="noopener"></a>

<script>
// The engine is taking over: drop the no-JS safety class.
// If this line never runs, CSS keeps the fork on screen.
document.documentElement.classList.remove("no-js");

// ============================================================
// CONFIG - the only place to edit when the wording changes
// ============================================================
const CONFIG = {
  title: "Вика, эти выходные",
  chosen: {
    picnic: "Значит, пикник",
    horses: "Значит, лошади"
  },
  cta: "Написать",
  reply: {
    picnic: "Давай пикник",
    horses: "Давай лошадей"
  },
  telegram: "ManyLattice"
};

// The <title> tag is authored in the markup so the tab is labelled even
// without JS; re-applying it here keeps CONFIG the single source of truth.
document.title = CONFIG.title;

const titleText = document.querySelector(".title-text");
const forkTitle = document.querySelector(".title--fork");

// ============================================================
// Telegram link
// ============================================================

/**
 * Builds a t.me link that opens a private chat with the text
 * pre-filled in the input field. The text is NOT sent
 * automatically - pressing send stays her decision.
 */
function buildTelegramUrl(username, text) {
  // Telegram usernames are shown as "@name" everywhere, so a leading "@"
  // is the likeliest thing to end up in CONFIG.telegram. Strip it -
  // t.me links must not contain it.
  const cleanUsername = username.trim().replace(/^@/, "");
  const base = `https://t.me/${cleanUsername}`;
  return text ? `${base}?text=${encodeURIComponent(text)}` : base;
}

// ============================================================
// Choice
// ============================================================
const forkScene = document.querySelector(".scene--fork");
const ctaEl = document.querySelector(".cta");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// The CTA appears only after the scene has settled, so the two
// movements read as one gesture instead of competing for attention.
const CTA_DELAY = reduceMotion ? 0 : 700;

let decided = false;

/**
 * Commits to one of the two options. There is deliberately no way back:
 * re-choosing would turn an impulse into browsing a menu. Reloading the
 * page is the only reset.
 */
function choose(choice) {
  if (decided) return;
  decided = true;

  forkScene.classList.remove("is-active");
  document.querySelector(`.scene--${choice}`).classList.add("is-active");

  // Swap the lettering artwork, and keep the hidden heading in step so
  // anything reading the page as text follows the same story.
  forkTitle.classList.remove("is-active");
  document.querySelector(`.title--${choice}`).classList.add("is-active");
  titleText.textContent = CONFIG.chosen[choice];

  document.body.classList.add("has-choice");

  ctaEl.textContent = CONFIG.cta;
  ctaEl.href = buildTelegramUrl(CONFIG.telegram, CONFIG.reply[choice]);

  window.setTimeout(() => ctaEl.classList.add("is-visible"), CTA_DELAY);
}

document.querySelectorAll(".zone").forEach((zone) => {
  zone.addEventListener("click", () => choose(zone.dataset.choice));
});

// Once a finger has landed anywhere the hints have said what they had to
// say; leaving them pulsing would nag. `once` unbinds after the first
// touch, and passive keeps the listener off the scroll path.
document.addEventListener("touchstart", () => {
  document.body.classList.add("is-touched");
}, { once: true, passive: true });
</script>

</body>
</html>
