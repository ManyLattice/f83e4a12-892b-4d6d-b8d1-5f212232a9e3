<!DOCTYPE html>
<html lang="ru" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вика, поехали</title>

<!-- Open Graph: preview when the link is shared in Telegram.
     Absolute URL is required - Telegram ignores relative paths.
     Replace the host after the GitHub Pages URL is known. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Вика, поехали">
<meta property="og:description" content="Степь, мотоциклы, суббота">
<meta property="og:image" content="https://manylattice.github.io/f83e4a12-892b-4d6d-b8d1-5f212232a9e3/images/journal-03-sunset.webp">

<!-- In-app browsers (Telegram, Instagram) paint their status bar and toolbar
     over the page and tint them with this colour - without it they fall back
     to the body background, which is the pale #F4EDE3 and shows as bright
     bands above and below the artwork. Sampled from the actual top and
     bottom edges of the journal pages (they run #AF7D41 to #DAAC6C), so the
     chrome blends into the paper instead of framing it. -->
<meta name="theme-color" content="#BE8B4E">

<link rel="preload" as="image" href="images/journal-01-road.webp">

<style>
/* ===== Variables ===== */
:root {
  --ink-heading: #3A2E24;
  --ink-body: #4A3728;
  --ink-muted: #6B5B48;
  --btn-fill: #A8452A;
  --btn-label: #FFFFFF;
  --font-serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ===== Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: auto; }

/* The artwork is now a full-bleed journal page with the paper baked in,
   so this is just a fallback colour shown while the image decodes -
   it prevents a white flash, nothing more. */
body {
  /* This shows through in two places where a pale value read as a bright
     band - behind in-app browser chrome, and in the rubber-band overscroll
     gap when the page is dragged past its end on iOS. Matched to the
     artwork's own edge tone so both blend into the paper. */
  background-color: #BE8B4E;
  color: var(--ink-body);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== Sections ===== */
.section {
  position: relative;
  height: 200vh;      /* double height gives the scroll room to scrub */
}

.section__sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  /* Text lives in the lower portion of the screen, over the image.
     Measured against the new artwork: the shared clean band across all
     three images is 75-95% of viewport height (see report for the
     per-band contrast readings). A 7vh bottom padding puts the text
     block's bottom edge at 93vh - 2vh of margin above the 95% floor,
     where bottom-edge staining wrecks contrast on every image - while
     the tallest block (section 3: heading + button) still tops out
     around 75.5vh, just inside the band's upper edge. Shorter blocks
     (sections 1-2) sit with more margin at the top of the band. */
  justify-content: flex-end;
  padding-bottom: calc(7vh + env(safe-area-inset-bottom));
}

/* Text sits on a readable measure; the illustration fills the whole
   screen behind it. Capped on desktop so lines stay short. */
.section__content {
  position: relative;
  width: min(100% - 44px, 620px);
  margin-left: auto;
  margin-right: auto;
}

/* Section 1 only: the pencil figure in the new artwork stands in the
   lower-left, roughly 52-78% down the page, and her ink is dark enough
   that overlapping text stays unreadable no matter the scrim. The
   right half of the frame is clean at every measured band. Pulling
   this block to the right (instead of centered) keeps it entirely
   over clean paper and clear of her at every scroll position - safer
   than relying on the sliver of band above her head. */
.section--road .section__content {
  margin-left: auto;
  /* Not margin-right: 0 - that pushed the text hard against the viewport
     edge and clipped the last glyph. The block keeps its own gutter. */
  margin-right: 22px;
  text-align: right;
}

/* Section 3 only. A 1%-row ink scan of the sunset page puts its
   handwritten note and arrow at 75-84% of the height, with bottom-edge
   staining from 94%. This section carries no heading - just the button -
   so it anchors to the bottom and lands in the 85-93% window below the
   note, leaving that note uncovered and readable as part of the page. */
.section--final .section__sticky {
  justify-content: flex-end;
  padding-top: 0;
  padding-bottom: calc(7vh + env(safe-area-inset-bottom));
}

.section__art {
  display: block;
  /* Full-bleed journal page: fills the entire sticky viewport edge to
     edge, top to bottom. The paper, stains and sketches are baked into
     the image itself, so it IS the screen rather than an element on it.
     Oversized by 8% and pulled back by half of that on each side, so the
     scrubbed scale (which starts below 1 to avoid ever overflowing the
     viewport) still covers the screen completely at every point in the
     animation. Without the oversize, scale(0.94) left a visible frame of
     background around the image - measured 12px at the sides. */
  position: absolute;
  top: -4%;
  left: -4%;
  width: 108%;
  height: 108%;
  object-fit: cover;
  object-position: center;
  will-change: transform;   /* only on the illustration, not on everything */
}

/* ===== Text scrim =====
   The paper carries dark stains and ink sketches throughout, so there is
   no clean zone for dark text - a scrim is required, not optional. Built
   as a soft paper-toned wash rather than a panel: fully transparent above
   the text band, strongest directly behind the text (75-93vh, where the
   text block now lives), fading out again toward the bottom edge so it
   never reads as a hard-edged box.

   Alpha is tuned PER SECTION from the measured worst-case background for
   its own artwork, so the two stronger pages (road, moto) get a lighter
   wash than the weakest one (sunset) - see the verification report for
   the composited-contrast arithmetic behind each value. All three clear
   4.5:1 for both heading and body ink with margin to spare. */
.section__scrim {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(244, 237, 227, 0) 0%,
      rgba(244, 237, 227, 0) 68%,
      rgba(244, 237, 227, var(--scrim-a)) 75%,
      rgba(244, 237, 227, var(--scrim-a)) 93%,
      rgba(244, 237, 227, calc(var(--scrim-a) * 0.5)) 100%
    );
  pointer-events: none;
}

.section--road .section__scrim,
.section--moto .section__scrim {
  --scrim-a: 0.42;
}

/* This page's paper is the weakest of the three, so it takes the highest
   alpha. The wash covers 72-93%, matching where the heading and button
   now sit, and stops short of the very bottom so the edge staining and
   the thumbprint stay visible as part of the artwork. */
.section--final .section__scrim {
  --scrim-a: 0.46;
  background:
    linear-gradient(
      to bottom,
      rgba(244, 237, 227, 0) 0%,
      rgba(244, 237, 227, 0) 64%,
      rgba(244, 237, 227, var(--scrim-a)) 72%,
      rgba(244, 237, 227, var(--scrim-a)) 93%,
      rgba(244, 237, 227, 0) 99%
    );
}

/* ===== Typography =====
   The artwork is busy - full-bleed paper, stains, sketches - so timid
   type disappears into it. Sized up and pushed heavier than the old
   sparse-on-blank-paper version so it holds its own against the image. */
.title {
  font-family: var(--font-serif);
  font-size: clamp(3rem, 15vw, 5rem);
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.05;
  color: var(--ink-heading);
}

.hint {
  margin-top: 12px;
  font-size: clamp(1.1rem, 5vw, 1.4rem);
  font-weight: 600;
  color: var(--ink-muted);
}

.lines {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.line {
  font-family: var(--font-sans);
  font-size: clamp(1.5rem, 7.2vw, 2.3rem);
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink-body);
}

.cta {
  display: block;
  width: 100%;
  padding: 20px 24px;
  background: var(--btn-fill);
  color: var(--btn-label);
  font-size: clamp(1.1rem, 4.8vw, 1.3rem);
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  border-radius: 16px;
}

/* ===== Scrubbed animations =====
   Each section decides what to do with its own --p.
   The engine only supplies the number.
   Scales stay at or below 1: the illustration is now full-bleed, so any
   scale above 1 pushes it past the viewport edge (measured 421px wide on
   a 390px screen before this). Every section grows INTO its box. */

/* Section 1: illustration eases in, text lifts and fades as you scroll past */
.section--road .section__art {
  transform: scale(calc(0.94 + var(--p, 0) * 0.06));
  opacity: calc(1 - var(--p, 0) * 0.5);
}
.section--road .section__content {
  transform: translateY(calc(var(--p, 0) * -40px));
  opacity: calc(1 - var(--p, 0) * 1.6);
}

/* Section 2: illustration settles, the three lines rise in sequence.
   Each line starts 0.08 later than the one before it (--i). */
.section--moto .section__art {
  transform: scale(calc(0.92 + var(--p, 0) * 0.08));
}
.section--moto .line {
  --start: calc(var(--i, 0) * 0.08);
  --local: calc((var(--p, 0) - var(--start)) * 3.2);
  opacity: clamp(0, var(--local), 1);
  transform: translateY(calc((1 - clamp(0, var(--local), 1)) * 26px));
}

/* Section 3: illustration settles, heading appears, button follows later */
.section--final .section__art {
  transform: scale(calc(0.94 + var(--p, 0) * 0.06));
}
/* The button is now the only element on this screen, so it no longer
   waits for a heading to land first - the old 0.18 delay existed to let
   the eye reach the heading before the button appeared. It rises on its
   own from the start of the section. */
.section--final .cta {
  --btn: clamp(0, calc(var(--p, 0) * 2.6), 1);
  opacity: var(--btn);
  transform: scale(calc(0.92 + var(--btn) * 0.08));
}

/* ===== No-JS fallback =====
   The scrubbed elements start at opacity 0 by design - they fade in as
   the engine advances --p. With no JS that never happens, so pin them
   to their end state. The class is removed by the script on load. */
.no-js .section__art,
.no-js .section__content,
.no-js .line,
.no-js .cta {
  transform: none !important;
  opacity: 1 !important;
}

/* ===== Reduced motion =====
   No scrubbing: sections become a plain vertical scroll,
   every element pinned to its final state. */
@media (prefers-reduced-motion: reduce) {
  .section {
    height: auto;
  }
  .section__sticky {
    position: relative;
    height: 100vh;
  }
  .section__art,
  .section__content,
  .line,
  .cta {
    transform: none !important;
    opacity: 1 !important;
  }
}
</style>
</head>
<body>

<main>

<!-- ===== Section 1: the invitation ===== -->
<section class="section section--road">
  <div class="section__sticky">
    <img class="section__art" src="images/journal-01-road.webp" alt="">
    <div class="section__scrim"></div>
    <div class="section__content">
      <h1 class="title"><span data-config="name">Вика</span>,</h1>
      <p class="hint">предлагаю тебе</p>
    </div>
  </div>
</section>

<!-- ===== Section 2: the plan ===== -->
<section class="section section--moto">
  <div class="section__sticky">
    <img class="section__art" src="images/journal-02-moto.webp" alt="" loading="lazy">
    <div class="section__scrim"></div>
    <div class="section__content">
      <ul class="lines">
        <li class="line" style="--i:0">В субботу - степь,</li>
        <li class="line" style="--i:1">недалеко от города,</li>
        <li class="line" style="--i:2">два мотоцикла.</li>
      </ul>
    </div>
  </div>
</section>

<!-- ===== Section 3: the ask ===== -->
<section class="section section--final">
  <div class="section__sticky">
    <img class="section__art" src="images/journal-03-sunset.webp" alt="" loading="lazy">
    <div class="section__scrim"></div>
    <div class="section__content">
      <a class="cta" href="https://t.me/" target="_blank" rel="noopener">Поехали</a>
    </div>
  </div>
</section>

</main>

<script>
// The engine is about to take over: drop the no-JS safety class.
// If this line never runs, CSS keeps every element in its visible end state.
document.documentElement.classList.remove("no-js");

// ============================================================
// CONFIG - the only place to edit when the content changes
// ============================================================
const CONFIG = {
  name: "Вика",
  place: "",              // not rendered in the current copy
  when: "выходные",       // not rendered in the current copy
  telegram: "ManyLattice",
  reply: "(☞ﾟヮﾟ)☞ Погнали ☜(ﾟヮﾟ☜)"
};

// ============================================================
// Telegram link
// ============================================================

/**
 * Builds a t.me link that opens a private chat with the text
 * pre-filled in the input field. The text is NOT sent
 * automatically - pressing send stays her decision.
 */
function buildTelegramUrl(username, text) {
  // Telegram usernames are displayed as "@name" everywhere, so a leading
  // "@" (plus any surrounding whitespace) is the likeliest thing to end up
  // in CONFIG.telegram. Strip it - t.me links must not include the "@".
  const cleanUsername = username.trim().replace(/^@/, "");
  const base = `https://t.me/${cleanUsername}`;
  return text ? `${base}?text=${encodeURIComponent(text)}` : base;
}

// ============================================================
// ScrollEngine - turns scroll position into a 0..1 progress
// value per section, written to the --p custom property.
// Knows nothing about what the animations look like.
// ============================================================

/**
 * How far a section has scrolled through the viewport.
 *
 * 0 - the section's top edge just reached the top of the screen
 * 1 - the section's bottom edge reached the bottom of the screen
 *
 * The section is 200vh tall with a 100vh sticky child, so the
 * scrubbing distance is exactly one viewport height.
 */
function sectionProgress(rect, viewportHeight) {
  const distance = rect.height - viewportHeight;
  if (distance <= 0) return 0;
  const scrolled = -rect.top;
  return Math.min(1, Math.max(0, scrolled / distance));
}

const ScrollEngine = {
  sections: [],
  smoothed: [],
  // Tracks whether a section's off-screen endpoint has already been
  // snapped and written. Reset to false whenever the section is back
  // on screen, so it re-settles correctly if it goes off-screen again
  // (including after a resize/orientation change moves the boundary).
  settled: [],

  start() {
    this.sections = Array.from(document.querySelectorAll(".section"));
    this.smoothed = this.sections.map(() => 0);
    this.settled = this.sections.map(() => false);
    this.tick();
  },

  tick() {
    const vh = window.innerHeight;

    // Phase 1: read everything. Never interleave reads and writes -
    // that forces a layout recalculation per section (layout thrashing),
    // which is immediately visible on a phone.
    // For each section we compute either a lerp target (on-screen) or
    // a settle endpoint (off-screen) - never both.
    const plans = this.sections.map((section) => {
      const rect = section.getBoundingClientRect();
      const offTop = rect.bottom < 0;
      const offBottom = rect.top > vh;
      if (offTop || offBottom) {
        // Scrolled past the top settles at 1, not yet reached settles at 0.
        return { settle: offTop ? 1 : 0 };
      }
      return { target: sectionProgress(rect, vh) };
    });

    // Phase 2: write everything.
    plans.forEach((plan, i) => {
      if ("settle" in plan) {
        // Already snapped to this endpoint and not touched since - skip,
        // this is what keeps a permanently off-screen section cheap.
        if (this.settled[i] && this.smoothed[i] === plan.settle) return;
        this.smoothed[i] = plan.settle;
        this.settled[i] = true;
        this.sections[i].style.setProperty("--p", this.smoothed[i].toFixed(4));
        return;
      }
      // Back on screen - resume normal easing next time it leaves.
      this.settled[i] = false;
      // lerp: the value chases its target instead of snapping to it.
      // Without this the scrubbing looks jerky.
      this.smoothed[i] += (plan.target - this.smoothed[i]) * 0.1;
      this.sections[i].style.setProperty("--p", this.smoothed[i].toFixed(4));
    });

    requestAnimationFrame(() => this.tick());
  }
};

// ============================================================
// init - inject CONFIG into markup, wire up the links
// ============================================================
function init() {
  // Text substitution: every [data-config] element gets its value.
  // Empty values leave the markup default in place.
  document.querySelectorAll("[data-config]").forEach((el) => {
    const value = CONFIG[el.dataset.config];
    if (value) el.textContent = value;
  });

  const cta = document.querySelector(".cta");

  if (cta) cta.href = buildTelegramUrl(CONFIG.telegram, CONFIG.reply);

  // Respect the OS "reduce motion" setting: scrubbing can make people
  // with motion sensitivity physically unwell. CSS puts everything in
  // its final state via the matching media query.
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduceMotion) ScrollEngine.start();
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
