<!DOCTYPE html>
<html lang="ru" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вика, эти выходные</title>

<!-- Open Graph: preview when the link is shared in Telegram.
     Absolute URL is required - Telegram ignores relative paths.
     Replace the host once the GitHub Pages URL is known. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Вика, эти выходные">
<meta property="og:description" content="Выбирай">
<meta property="og:image" content="https://manylattice.github.io/weekend-date/images/fork.webp">

<!-- In-app browsers (Telegram, Instagram) paint their chrome over the
     page and tint it with this colour. Sampled from the evening sky of
     the fork illustration so the chrome blends into the artwork. -->
<meta name="theme-color" content="#C79A5C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<link rel="preload" as="image" href="images/fork.webp">
<!-- Both outcomes are preloaded: the switch after a tap has to be
     instant, and a half-loaded scene would show a blank screen at the
     one moment the page is supposed to feel like an answer. -->
<link rel="preload" as="image" href="images/picnic.webp">
<link rel="preload" as="image" href="images/horses.webp">

<style>
/* ===== Variables ===== */
:root {
  --dur: 650ms;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ink: #FFFFFF;
  /* Cormorant carries the headings; Georgia stays as the fallback that
     paints first and the safety net if the webfont never arrives. */
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
}

/* ===== Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  /* Only ever visible for an instant before the artwork paints.
     Sampled from the illustration's own sky. */
  background-color: #E8B978;
  color: var(--ink);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;          /* single screen, never scrolls */
}

/* ===== Stage =====
   All three illustrations are stacked in the same box. Only one is
   opaque at a time, so switching scenes is a cross-fade rather than a
   load - nothing ever has to be fetched mid-gesture. */
.stage {
  position: relative;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

.scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
}

.scene.is-active { opacity: 1; }


/* Focal points, per illustration. The fork is framed so the blanket and
   the horses sit inside the safe area on a phone; centring it keeps both
   in view. */
.scene--fork   { object-position: 50% 50%; }

/* A wide screen crops this tall artwork nearly in half top-to-bottom,
   and no anchor point can hold the couple, the blanket and the horses at
   once - each choice of focus drops one of them. Since the fork is the
   one image whose edges ARE the content, show it whole here and let the
   sides fill with its own colour. Phones, the real audience, keep the
   full-bleed crop above. */
@media (orientation: landscape) {
  .scene--fork {
    object-fit: contain;
    background: #C98F53;
  }

}
.scene--picnic { object-position: 50% 64%; }
.scene--horses { object-position: 45% 50%; }

/* Readability layer: white text has to survive both a pale sky and a
   sunlit field, and the resting dim also gives the hover states
   something to lift. */
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(28, 24, 16, 0.26);
  pointer-events: none;
  transition: background var(--dur) var(--ease);
  z-index: 1;
}

/* ===== Choice zones =====
   Two invisible halves laid over the fork. They are real <button>s so
   the choice is reachable from a keyboard, not just from a tap. */
.zones {
  position: absolute;
  inset: 0;
  display: flex;
  z-index: 2;
}

/* On a wide screen the fork is letterboxed, so the zones are pulled in
   to the artwork's own edges - clicking the empty side margins must not
   pick a road. Declared after `.zones` so it wins the cascade. */
@media (orientation: landscape) {
  .zones {
    width: min(100%, calc(100dvh * 941 / 1672));
    inset: 0 auto 0 50%;
    transform: translateX(-50%);
  }
}

.zone {
  flex: 1 1 50%;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  transition: background var(--dur) var(--ease);
}

/* Hover lifts the side you reach for and leaves the other alone -
   the road you lean toward gets brighter. */
@media (hover: hover) {
  .zone:hover { background: rgba(255, 244, 214, 0.13); }
}

.zone:active { background: rgba(28, 24, 16, 0.12); }

/* Once chosen, the zones stop existing - there is no way back. */
body.has-choice .zones { display: none; }

/* ===== Title ===== */
.title {
  position: fixed;
  top: calc(5vh + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  width: min(100% - 64px, 560px);
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(30px, 7.2vw, 52px);
  font-weight: 300;
  letter-spacing: 0.06em;
  line-height: 1.15;
  text-shadow: 0 2px 18px rgba(20, 16, 10, 0.55);
  pointer-events: none;      /* never blocks a tap on the zones */
  z-index: 3;
}

/* ===== CTA ===== */
.cta {
  position: fixed;
  left: 50%;
  bottom: calc(8vh + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  z-index: 4;
  display: inline-block;
  padding: 16px 44px;
  border-radius: 999px;
  background: #FFFFFF;
  color: #2C2418;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-decoration: none;
  box-shadow: 0 8px 30px rgba(20, 16, 10, 0.35);
  /* Hidden until a choice is made, and inert while hidden. */
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 380ms var(--ease),
              transform 380ms var(--ease),
              visibility 380ms;
}

.cta.is-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
}

/* ===== Breathing =====
   The page carries no "tap me" label, so stillness would read as a
   static picture. A slow zoom keeps the scene alive until a choice
   freezes it. */
@keyframes breathe {
  0%   { transform: scale(1.00); }
  50%  { transform: scale(1.04); }
  100% { transform: scale(1.00); }
}

.scene--fork.is-active { animation: breathe 11s ease-in-out infinite; }
body.has-choice .scene { animation: none; }

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  .scene, .stage::after, .cta, .zone { transition-duration: 1ms; }
  .scene--fork.is-active { animation: none; }
}

/* ===== No JS =====
   Without the script the fork stays on screen and the choice is inert:
   a degraded page, never a blank one. */
.no-js .cta { display: none; }
.no-js .scene--fork { opacity: 1; }
</style>
</head>
<body>

<!-- Fallback copy for the no-JS case; the script overwrites it from CONFIG. -->
<h1 class="title">Вика, эти выходные</h1>

<div class="stage">
  <img class="scene scene--fork is-active" src="images/fork.webp"
       alt="Пара стоит перед развилкой: слева пикник у пруда, справа лошади в степи">
  <img class="scene scene--picnic" src="images/picnic.webp" alt="">
  <img class="scene scene--horses" src="images/horses.webp" alt="">

  <div class="zones">
    <button class="zone" type="button" data-choice="picnic" aria-label="Пикник"></button>
    <button class="zone" type="button" data-choice="horses" aria-label="Лошади"></button>
  </div>
</div>

<a class="cta" href="#" target="_blank" rel="noopener"></a>

<script>
// The engine is taking over: drop the no-JS safety class.
// If this line never runs, CSS keeps the fork on screen.
document.documentElement.classList.remove("no-js");

// ============================================================
// CONFIG - the only place to edit when the wording changes
// ============================================================
const CONFIG = {
  title: "Вика, эти выходные",
  chosen: {
    picnic: "Значит, пикник",
    horses: "Значит, лошади"
  },
  cta: "Написать",
  reply: {
    picnic: "Давай пикник",
    horses: "Давай лошадей"
  },
  telegram: "ManyLattice"
};

const titleEl = document.querySelector(".title");
titleEl.textContent = CONFIG.title;

// The <title> tag is authored in the markup so the tab is labelled even
// without JS; re-applying it here keeps CONFIG the single source of truth.
document.title = CONFIG.title;

// ============================================================
// Telegram link
// ============================================================

/**
 * Builds a t.me link that opens a private chat with the text
 * pre-filled in the input field. The text is NOT sent
 * automatically - pressing send stays her decision.
 */
function buildTelegramUrl(username, text) {
  // Telegram usernames are shown as "@name" everywhere, so a leading "@"
  // is the likeliest thing to end up in CONFIG.telegram. Strip it -
  // t.me links must not contain it.
  const cleanUsername = username.trim().replace(/^@/, "");
  const base = `https://t.me/${cleanUsername}`;
  return text ? `${base}?text=${encodeURIComponent(text)}` : base;
}

// ============================================================
// Choice
// ============================================================
const forkScene = document.querySelector(".scene--fork");
const ctaEl = document.querySelector(".cta");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// The CTA appears only after the scene has settled, so the two
// movements read as one gesture instead of competing for attention.
const CTA_DELAY = reduceMotion ? 0 : 700;

let decided = false;

/**
 * Commits to one of the two options. There is deliberately no way back:
 * re-choosing would turn an impulse into browsing a menu. Reloading the
 * page is the only reset.
 */
function choose(choice) {
  if (decided) return;
  decided = true;

  forkScene.classList.remove("is-active");
  document.querySelector(`.scene--${choice}`).classList.add("is-active");

  document.body.classList.add("has-choice");
  titleEl.textContent = CONFIG.chosen[choice];

  ctaEl.textContent = CONFIG.cta;
  ctaEl.href = buildTelegramUrl(CONFIG.telegram, CONFIG.reply[choice]);

  window.setTimeout(() => ctaEl.classList.add("is-visible"), CTA_DELAY);
}

document.querySelectorAll(".zone").forEach((zone) => {
  zone.addEventListener("click", () => choose(zone.dataset.choice));
});
</script>

</body>
</html>
